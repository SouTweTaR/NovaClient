name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip NovaClient.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"
      - run: gradle build
        working-directory: NovaClient
      - uses: actions/upload-artifact@v4
        with:
          name: novaclient-mod
          path: NovaClient/build/libs/novaclient-1.0.0.jar
